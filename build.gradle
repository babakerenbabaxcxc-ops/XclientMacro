plugins {
    // Loom 1.14.x is what Fabric's own 1.21.11 announcement points developers at
    // (the "dev/1.14" branch). The legacy 'fabric-loom' plugin id still works for
    // obfuscated versions like 1.21.11 - Fabric also now publishes the forward-
    // looking 'net.fabricmc.fabric-loom-remap' id for this same purpose, but as
    // of this writing that one is still shipping alpha builds, so this is the
    // safer pin. Swap to it once it has a stable release if you want to track
    // the newer id.
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "x-client" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
